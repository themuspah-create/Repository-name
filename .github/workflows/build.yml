name: Build APK
on:
  workflow_dispatch:
  push:
    paths: ['VoiceAssistant.zip']
permissions:
  contents: write
jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.7'
      - run: unzip -q VoiceAssistant.zip
      - run: cd VoiceAssistant && gradle assembleDebug --no-daemon
      - uses: softprops/action-gh-release@v2
        with:
          tag_name: build-${{ github.run_number }}
          files: VoiceAssistant/app/build/outputs/apk/debug/app-debug.apk
